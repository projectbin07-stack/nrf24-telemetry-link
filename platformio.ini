; nrf24-telemetry-link
;
;   Node (PTX, sends telemetry, receives commands in ACK payloads):
;     pio run -e nanoatmega328          Arduino Nano (ATmega328P, 16 MHz)
;     pio run -e esp32dev               ESP32 DevKit
;     pio run -e nucleo_f401re          ST NUCLEO-F401RE
;   Gateway (PRX, forwards frames to USB serial, sends commands):
;     pio run -e nanoatmega328_gateway
;     pio run -e esp32dev_gateway
;     pio run -e nucleo_f401re_gateway
;   Host unit tests (no hardware):
;     pio test -e native

[platformio]
default_envs = nanoatmega328

[env]
; lib/linkcore is C++17; the Arduino cores default to gnu++11 / gnu++14.
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra
monitor_speed = 115200

[node]
build_src_filter = +<*> -<gateway_main.cpp>

[gateway]
build_src_filter = +<*> -<node_main.cpp>

; ATmega328P: 2 KB RAM. Messages are capped at 64 bytes (3 fragments) and the
; host->gateway serial body at 72 bytes to keep buffers small.
[nano]
platform = atmelavr@5.1.0
framework = arduino
board = nanoatmega328
build_flags = ${env.build_flags} -D NTL_BOARD_NANO -D LINKCORE_MAX_MESSAGE=64
    -D LINKCORE_SERIAL_MAX_BODY=72

[esp32]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
build_flags = ${env.build_flags} -D NTL_BOARD_ESP32DEV

[nucleo]
platform = ststm32@19.7.1
framework = arduino
board = nucleo_f401re
build_flags = ${env.build_flags} -D NTL_BOARD_NUCLEO_F401RE

[env:nanoatmega328]
extends = nano
build_src_filter = ${node.build_src_filter}

[env:nanoatmega328_gateway]
extends = nano
build_src_filter = ${gateway.build_src_filter}

[env:esp32dev]
extends = esp32
build_src_filter = ${node.build_src_filter}

[env:esp32dev_gateway]
extends = esp32
build_src_filter = ${gateway.build_src_filter}

[env:nucleo_f401re]
extends = nucleo
build_src_filter = ${node.build_src_filter}

[env:nucleo_f401re_gateway]
extends = nucleo
build_src_filter = ${gateway.build_src_filter}

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -D UNITY_INCLUDE_DOUBLE
